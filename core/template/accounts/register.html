{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تکمیل اطلاعات | رزرو نوبت</title>

    <script src="{% static 'js/config.js' %}"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- ==================== HEADER ==================== -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">

            <a href="{% url 'booking:home' %}" class="flex items-center gap-2 shrink-0">
                <div class="w-10 h-10 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-xl flex items-center justify-center text-white text-xl shadow-md shadow-teal-200 dark:shadow-teal-900/50">
                    🏥
                </div>
                <div class="hidden sm:block">
                    <p class="font-bold leading-tight">رزرو نوبت</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400 leading-tight">سیستم آنلاین پزشکان</p>
                </div>
            </a>

            <div class="flex items-center gap-2">
                <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition text-lg">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:inline">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ==================== MAIN ==================== -->
    <main class="flex-1 flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-md">

            <!-- Card -->
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 border border-slate-100 dark:border-slate-700 shadow-lg">

                <!-- Icon -->
                <div class="flex justify-center mb-5">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-teal-400 to-cyan-500 flex items-center justify-center text-3xl text-white shadow-lg shadow-teal-200 dark:shadow-teal-900/50">
                        📝
                    </div>
                </div>

                <!-- Title -->
                <h1 class="text-xl font-bold text-center mb-2">تکمیل اطلاعات</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 text-center mb-8">
                    برای تکمیل ثبت‌نام، اطلاعات زیر را وارد کنید
                </p>

                <!-- Form -->
                <form action="{% url 'accounts:register' %}" method="post">
                    {% csrf_token %}
                    <!-- First name -->
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">نام</label>
                        <input type="text"
                               name="first_name"
                               placeholder="مثلاً علی"
                               class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100 placeholder-slate-400">
                    </div>

                    <!-- Last name -->
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">نام خانوادگی</label>
                        <input type="text"
                               name="last_name"
                               placeholder="مثلاً محمدی"
                               class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100 placeholder-slate-400">
                    </div>

                    <!-- National ID -->
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">کد ملی</label>
                        <input type="text"
                               name="national_id"
                               placeholder="۱۰ رقم"
                               maxlength="10"
                               inputmode="numeric"
                               class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100 placeholder-slate-400">
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-2">رمز عبور</label>
                        <div class="relative password-wrapper">
                            <input type="password"
                                   name="password"
                                   placeholder="••••••••"
                                   class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100 placeholder-slate-400 pl-12">

                            <span class="password-toggle absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer text-lg select-none">👁</span>
                        </div>
                    </div>

                    <!-- Confirm password -->
                    <div class="mb-6">
                        <label class="block text-sm font-semibold mb-2">تکرار رمز عبور</label>
                        <div class="relative password-wrapper">
                            <input type="password"
                                   name="confirm_password"
                                   placeholder="••••••••"
                                   class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100 placeholder-slate-400 pl-12">

                            <span class="password-toggle absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer text-lg select-none">👁</span>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit"
                            class="w-full bg-gradient-to-l from-teal-500 to-cyan-500 text-white font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-teal-200 dark:hover:shadow-teal-900/50 transition">
                        ثبت‌نام
                    </button>

                </form>

                <!-- Terms -->
                <label class="flex items-start gap-3 mt-6 cursor-pointer select-none">
                    <input type="checkbox" required
                        class="peer sr-only">

                    <!-- Custom checkbox -->
                    <span class="shrink-0 w-5 h-5 mt-0.5 rounded-md border-2 border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 flex items-center justify-center transition
                                peer-checked:bg-gradient-to-l peer-checked:from-teal-500 peer-checked:to-cyan-500 peer-checked:border-transparent">
                        <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                        </svg>
                    </span>

                    <span class="text-xs text-slate-500 dark:text-slate-400 leading-6">
                        با ورود یا ثبت‌نام،
                        <a href="#" class="text-teal-600 dark:text-teal-400 hover:underline">قوانین و مقررات</a>
                        و
                        <a href="#" class="text-teal-600 dark:text-teal-400 hover:underline">حریم خصوصی</a>
                        را می‌پذیرم.
                    </span>
                </label>

            </div>

            <!-- Back to login -->
            <div class="text-center mt-6">
                <a href="{% url 'accounts:login' %}" class="text-sm text-slate-500 dark:text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 transition">
                    ← بازگشت به ورود
                </a>
            </div>

        </div>

    </main>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
