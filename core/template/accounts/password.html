<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود با رمز عبور | رزرو نوبت</title>

    <script src="js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- ==================== HEADER ==================== -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">

            <a href="index.html" class="flex items-center gap-2 shrink-0">
                <div class="w-10 h-10 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-xl flex items-center justify-center text-white text-xl shadow-md shadow-teal-200 dark:shadow-teal-900/50">
                    🏥
                </div>
                <div class="hidden sm:block">
                    <p class="font-bold leading-tight">رزرو نوبت</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400 leading-tight">سیستم آنلاین پزشکان</p>
                </div>
            </a>

            <div class="flex items-center gap-2">
                <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition text-lg">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:inline">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ==================== MAIN ==================== -->
    <main class="flex-1 flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-md">

            <!-- Card -->
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 border border-slate-100 dark:border-slate-700 shadow-lg">

                <!-- Icon -->
                <div class="flex justify-center mb-5">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-teal-400 to-cyan-500 flex items-center justify-center text-3xl text-white shadow-lg shadow-teal-200 dark:shadow-teal-900/50">
                        🔒
                    </div>
                </div>

                <!-- Title -->
                <h1 class="text-xl font-bold text-center mb-2">ورود با رمز عبور</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 text-center mb-8">
                    رمز عبور خود را وارد کنید
                </p>

                <!-- Phone display -->
                <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 mb-5">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">📱</span>
                        <span class="text-sm font-semibold" dir="ltr">09123456789</span>
                    </div>
                    <a href="login.html" class="text-xs text-teal-600 dark:text-teal-400 hover:underline font-semibold">
                        ویرایش
                    </a>
                </div>

                <!-- Form -->
                <form action="panel.html" method="get">

                    <!-- Password -->
                    <div class="relative password-wrapper">
                        <input type="password"
                            name="password"
                            id="passwordInput"
                            placeholder="••••••••"
                            class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100 placeholder-slate-400 pl-12">

                        <span class="password-toggle absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer text-lg select-none">👁</span>
                    </div>

                    <!-- Forgot password -->
                    <div class="mb-6 text-left">
                        <a href="forgot.html" class="text-xs text-teal-600 dark:text-teal-400 hover:underline font-semibold">
                            فراموشی رمز عبور؟
                        </a>
                    </div>

                    <!-- Submit -->
                    <button type="submit"
                            class="w-full bg-gradient-to-l from-teal-500 to-cyan-500 text-white font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-teal-200 dark:hover:shadow-teal-900/50 transition">
                        ورود
                    </button>

                </form>

                <!-- Divider -->
                <div class="flex items-center gap-3 my-6">
                    <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
                    <span class="text-xs text-slate-400 dark:text-slate-500">یا</span>
                    <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
                </div>

                <!-- OTP login -->
                <a href="verify.html"
                   class="block w-full text-center py-3 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-700 dark:text-slate-300 hover:border-teal-400 dark:hover:border-teal-500 transition">
                    🔐 ورود با کد یکبار مصرف
                </a>

            </div>

            <!-- Back to login -->
            <div class="text-center mt-6">
                <a href="login.html" class="text-sm text-slate-500 dark:text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 transition">
                    ← ویرایش شماره موبایل
                </a>
            </div>

        </div>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
