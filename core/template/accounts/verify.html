{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کد تایید | رزرو نوبت</title>

    <script src="{% static 'js/config.js' %}"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- ==================== HEADER ==================== -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">

            <a href="{% url 'booking:home' %}" class="flex items-center gap-2 shrink-0">
                <div class="w-10 h-10 bg-gradient-to-br from-teal-400 to-cyan-500 rounded-xl flex items-center justify-center text-white text-xl shadow-md shadow-teal-200 dark:shadow-teal-900/50">
                    🏥
                </div>
                <div class="hidden sm:block">
                    <p class="font-bold leading-tight">رزرو نوبت</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400 leading-tight">سیستم آنلاین پزشکان</p>
                </div>
            </a>

            <div class="flex items-center gap-2">
                <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition text-lg">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:inline">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ==================== MAIN ==================== -->
    <main class="flex-1 flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-md">

            <!-- Card -->
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-8 border border-slate-100 dark:border-slate-700 shadow-lg">

                <!-- Icon -->
                <div class="flex justify-center mb-5">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-teal-400 to-cyan-500 flex items-center justify-center text-3xl text-white shadow-lg shadow-teal-200 dark:shadow-teal-900/50">
                        🔐
                    </div>
                </div>

                <!-- Title -->
                <h1 class="text-xl font-bold text-center mb-2">کد تایید</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 text-center mb-8">
                    کد ۶ رقمی ارسال شده به شماره زیر را وارد کنید
                </p>

                <!-- Phone display -->
                <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 mb-6">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">📱</span>
                        <span class="text-sm font-semibold" dir="ltr">{{ phone_number }}</span>
                    </div>
                    <a href="{% url 'accounts:login' %}" class="text-xs text-teal-600 dark:text-teal-400 hover:underline font-semibold">
                        ویرایش
                    </a>
                </div>

                <!-- Demo code box -->
                <div class="bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/30 rounded-xl px-4 py-3 mb-6">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-lg">ℹ️</span>
                        <span class="text-xs font-bold text-amber-700 dark:text-amber-400">حالت دمو</span>
                    </div>
                    <p class="text-xs text-amber-700 dark:text-amber-400 leading-6">
                        کد شما: <span class="font-bold tracking-widest text-base" dir="ltr">{{otp}}</span>
                    </p>
                </div>

                <!-- Form -->
                <form action="{% url 'accounts:register' %}" method="post">
                    {% csrf_token %}
                    <!-- OTP inputs -->
                    <label class="block text-sm font-semibold mb-3">کد تایید</label>
                    <div class="grid grid-cols-6 gap-2 mb-6" dir="ltr">
                        <input type="text" maxlength="1" inputmode="numeric" class="otp-input w-full aspect-square text-center text-lg font-bold bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100">
                        <input type="text" maxlength="1" inputmode="numeric" class="otp-input w-full aspect-square text-center text-lg font-bold bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100">
                        <input type="text" maxlength="1" inputmode="numeric" class="otp-input w-full aspect-square text-center text-lg font-bold bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100">
                        <input type="text" maxlength="1" inputmode="numeric" class="otp-input w-full aspect-square text-center text-lg font-bold bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100">
                        <input type="text" maxlength="1" inputmode="numeric" class="otp-input w-full aspect-square text-center text-lg font-bold bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100">
                        <input type="text" maxlength="1" inputmode="numeric" class="otp-input w-full aspect-square text-center text-lg font-bold bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:border-teal-500 focus:outline-none transition text-slate-800 dark:text-slate-100">
                    </div>

                    <!-- Submit -->
                    <button type="submit"
                            class="w-full bg-gradient-to-l from-teal-500 to-cyan-500 text-white font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-teal-200 dark:hover:shadow-teal-900/50 transition">
                        تایید
                    </button>

                </form>

                <!-- Resend -->
                <div class="flex items-center justify-between mt-6 text-xs">
                    <button type="button" id="resend-btn" class="text-slate-500 dark:text-slate-400 cursor-not-allowed" disabled>
                        ⏱ ارسال مجدد تا <span id="timer">02:00</span>
                    </button>
                    <a href="{% url 'accounts:login' %}" class="text-teal-600 dark:text-teal-400 hover:underline font-semibold">
                        ویرایش شماره
                    </a>
                </div>

            </div>

            <!-- Back to login -->
            <div class="text-center mt-6">
                <a href="{% url 'accounts:login' %}" class="text-sm text-slate-500 dark:text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 transition">
                    ← بازگشت به ورود
                </a>
            </div>

        </div>

    </main>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
